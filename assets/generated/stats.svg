="72" y1="332.0" x2="832" y2="332.0" stroke="#ffffff" stroke-opacity=".08" stroke-dasharray="3 6"/><text x="452.0" y="268.0" text-anchor="middle" font-size="16" fill="#7f89a8">数据将在首次运行 GitHub Action 后生成</text><rect x="880" y="158" width="272" height="214" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12" /><g class="fade" style="animation-delay:0.40s"><circle cx="908" cy="201" r="4.5" fill="#5eead4"/><text x="924" y="206" font-size="15" fill="#b4bcd6">当前连续</text><text x="1106" y="208" text-anchor="end" font-size="26" font-weight="800" fill="#eef2ff">—</text><text x="1128" y="206" text-anchor="end" font-size="14" fill="#7f89a8">天</text></g><line x1="902" y1="234" x2="1130" y2="234" stroke="#ffffff" stroke-opacity=".08"/><g class="fade" style="animation-delay:0.50s"><circle cx="908" cy="263" r="4.5" fill="#5eead4"/><text x="924" y="268" font-size="15" fill="#b4bcd6">最长连续</text><text x="1106" y="270" text-anchor="end" font-size="26" font-weight="800" fill="#eef2ff">—</text><text x="1128" y="268" text-anchor="end" font-size="14" fill="#7f89a8">天</text></g><line x1="902" y1="296" x2="1130" y2="296" stroke="#ffffff" stroke-opacity=".08"/><g class="fade" style="animation-delay:0.60s"><circle cx="908" cy="325" r="4.5" fill="#5eead4"/><text x="924" y="330" font-size="15" fill="#b4bcd6">活跃天数</text><text x="1106" y="332" text-anchor="end" font-size="26" font-weight="800" fill="#eef2ff">—</text><text x="1128" y="330" text-anchor="end" font-size="14" fill="#7f89a8">天</text></g></g>
