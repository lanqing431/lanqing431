<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250">
<defs>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <clipPath id="clip"><rect width="1200" height="250" rx="24"/></clipPath>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <radialGradient id="orb" cx=".35" cy=".3"><stop offset="0" stop-color="#ffffff" stop-opacity=".5"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/></radialGradient>

</defs>
<style>
.b1{animation:b1 24s ease-in-out infinite}.b2{animation:b2 28s ease-in-out infinite}
.b3{animation:b3 32s ease-in-out infinite}.b4{animation:b4 26s ease-in-out infinite}
@keyframes b1{50%{transform:translate(140px,40px)}}@keyframes b2{50%{transform:translate(-160px,30px)}}
@keyframes b3{50%{transform:translate(90px,-50px)}}@keyframes b4{50%{transform:translate(-80px,-40px)}}
.fade{opacity:0;animation:fade 1s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes show{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
.fl{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.fade{opacity:1!important}}</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="250" fill="#0f1424"/>
  <g filter="url(#blur)" opacity=".22"><circle cx="100" cy="0" r="200" fill="#0ea5e9"/></g>
  <rect width="1200" height="250" fill="#ffffff" fill-opacity=".03"/>
  <g font-family="'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','WenQuanYi Zen Hei',-apple-system,Helvetica,Arial,sans-serif"><g class="fade" style="animation-delay:0.00s"><rect x="48.0" y="40" width="258" height="170" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14" /><circle cx="94.0" cy="88" r="24" fill="#5eead4" fill-opacity=".16"/><g transform="translate(94.0,88)" style="color:#5eead4"><g transform="translate(-13,-13) scale(1.08)"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="72.0" y="152" font-size="21" font-weight="700" fill="#eef2ff">工具调用</text><text x="72.0" y="182" font-size="15" fill="#b4bcd6">让模型安全地使用外部能力</text></g><g class="fade" style="animation-delay:0.12s"><rect x="330.0" y="40" width="258" height="170" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14" /><circle cx="376.0" cy="88" r="24" fill="#5eead4" fill-opacity=".16"/><g transform="translate(376.0,88)" style="color:#5eead4"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="-10" cy="-9" r="4"/><circle cx="10" cy="0" r="4"/><circle cx="-10" cy="10" r="4"/><path d="M-6 -7.5 L6 -1.8 M-6 8.5 L6 1.8"/></g></g><text x="354.0" y="152" font-size="21" font-weight="700" fill="#eef2ff">任务规划</text><text x="354.0" y="182" font-size="15" fill="#b4bcd6">把模糊目标拆成可执行步骤</text></g><g class="fade" style="animation-delay:0.24s"><rect x="612.0" y="40" width="258" height="170" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14" /><circle cx="658.0" cy="88" r="24" fill="#5eead4" fill-opacity=".16"/><g transform="translate(658.0,88)" style="color:#5eead4"><g fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="0" cy="-9" rx="12" ry="4.5"/><path d="M-12 -9 v18 a12 4.5 0 0 0 24 0 v-18 M-12 0 a12 4.5 0 0 0 24 0"/></g></g><text x="636.0" y="152" font-size="21" font-weight="700" fill="#eef2ff">记忆系统</text><text x="636.0" y="182" font-size="15" fill="#b4bcd6">短期上下文与长期经验</text></g><g class="fade" style="animation-delay:0.36s"><rect x="894.0" y="40" width="258" height="170" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".14" /><circle cx="940.0" cy="88" r="24" fill="#5eead4" fill-opacity=".16"/><g transform="translate(940.0,88)" style="color:#5eead4"><g fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="0" cy="-9" r="5.5"/><circle cx="-11" cy="9" r="5.5"/><circle cx="11" cy="9" r="5.5"/><path d="M-3 -4 L-8 4 M3 -4 L8 4 M-5 9 h10" stroke-linecap="round"/></g></g><text x="918.0" y="152" font-size="21" font-weight="700" fill="#eef2ff">多智能体</text><text x="918.0" y="182" font-size="15" fill="#b4bcd6">分工、协作与相互校验</text></g></g>
</g>
<rect x="180" y=".75" width="840" height="1" fill="url(#sheen)"/>
<rect x=".75" y=".75" width="1198.5" height="248.5" rx="23.25" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.5"/>
</svg>