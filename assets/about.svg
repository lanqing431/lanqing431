<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <clipPath id="clip"><rect width="1200" height="420" rx="24"/></clipPath>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <radialGradient id="orb" cx=".35" cy=".3"><stop offset="0" stop-color="#ffffff" stop-opacity=".5"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/></radialGradient>

</defs>
<style>
.b1{animation:b1 24s ease-in-out infinite}.b2{animation:b2 28s ease-in-out infinite}
.b3{animation:b3 32s ease-in-out infinite}.b4{animation:b4 26s ease-in-out infinite}
@keyframes b1{50%{transform:translate(140px,40px)}}@keyframes b2{50%{transform:translate(-160px,30px)}}
@keyframes b3{50%{transform:translate(90px,-50px)}}@keyframes b4{50%{transform:translate(-80px,-40px)}}
.fade{opacity:0;animation:fade 1s ease-out forwards}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes show{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
.fl{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px)}}
.trail{transform-origin:250px 210px;animation:spin 8s linear infinite}@keyframes spin{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}.act{opacity:0;animation:act 8s ease-in-out infinite}@keyframes act{0%,100%{opacity:1}20%,80%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.fade{opacity:1!important}}</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="420" fill="#0f1424"/>
  <g filter="url(#blur)" opacity=".22"><circle cx="200" cy="60" r="220" fill="#7c3aed"/></g>
  <rect width="1200" height="420" fill="#ffffff" fill-opacity=".03"/>

<g font-family="'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC','WenQuanYi Zen Hei',-apple-system,Helvetica,Arial,sans-serif">
  <circle cx="250" cy="210" r="128" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-dasharray="2 6"/>
  <g class="trail">
    <circle cx="250" cy="210" r="128" fill="none" stroke="#5eead4" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round" pathLength="100" stroke-dasharray="12 88" stroke-dashoffset="12"/>
    <circle cx="378" cy="210" r="6" fill="#ffffff"/>
  </g>
  <circle cx="250.0" cy="82.0" r="40" fill="#0f1424" fill-opacity=".6"/><circle cx="250.0" cy="82.0" r="40" fill="#ffffff" fill-opacity=".06" stroke="#5eead4" stroke-opacity=".45" stroke-width="1.5"/><circle cx="250.0" cy="82.0" r="40" fill="#5eead4" fill-opacity=".22" stroke="#5eead4" stroke-width="2" class="act" style="animation-delay:0s"/><text x="250.0" y="89.0" text-anchor="middle" font-size="20" font-weight="700" fill="#eef2ff">思考</text><circle cx="378.0" cy="210.0" r="40" fill="#0f1424" fill-opacity=".6"/><circle cx="378.0" cy="210.0" r="40" fill="#ffffff" fill-opacity=".06" stroke="#5eead4" stroke-opacity=".45" stroke-width="1.5"/><circle cx="378.0" cy="210.0" r="40" fill="#5eead4" fill-opacity=".22" stroke="#5eead4" stroke-width="2" class="act" style="animation-delay:-6s"/><text x="378.0" y="217.0" text-anchor="middle" font-size="20" font-weight="700" fill="#eef2ff">规划</text><circle cx="250.0" cy="338.0" r="40" fill="#0f1424" fill-opacity=".6"/><circle cx="250.0" cy="338.0" r="40" fill="#ffffff" fill-opacity=".06" stroke="#5eead4" stroke-opacity=".45" stroke-width="1.5"/><circle cx="250.0" cy="338.0" r="40" fill="#5eead4" fill-opacity=".22" stroke="#5eead4" stroke-width="2" class="act" style="animation-delay:-4s"/><text x="250.0" y="345.0" text-anchor="middle" font-size="20" font-weight="700" fill="#eef2ff">行动</text><circle cx="122.0" cy="210.0" r="40" fill="#0f1424" fill-opacity=".6"/><circle cx="122.0" cy="210.0" r="40" fill="#ffffff" fill-opacity=".06" stroke="#5eead4" stroke-opacity=".45" stroke-width="1.5"/><circle cx="122.0" cy="210.0" r="40" fill="#5eead4" fill-opacity=".22" stroke="#5eead4" stroke-width="2" class="act" style="animation-delay:-2s"/><text x="122.0" y="217.0" text-anchor="middle" font-size="20" font-weight="700" fill="#eef2ff">反思</text>
  <text x="250" y="208" text-anchor="middle" font-size="22" font-weight="800" fill="#eef2ff">Agent Loop</text>
  <text x="250" y="232" text-anchor="middle" font-size="14" fill="#7f89a8">我的工作方式</text>
  <g class="fade" style="animation-delay:0.20s"><rect x="520" y="52" width="632" height="68" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10" /><rect x="520" y="52" width="632" height="68" rx="14" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".35" class="act" style="animation-delay:0s"/><circle cx="560" cy="86" r="16" fill="#5eead4" fill-opacity=".18"/><text x="560" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#5eead4">1</text><text x="592" y="93" font-size="19" font-weight="700" fill="#eef2ff">思考</text><text x="652" y="93" font-size="16" fill="#b4bcd6">先弄清楚问题的本质，而不是急着动手</text></g><g class="fade" style="animation-delay:0.35s"><rect x="520" y="132" width="632" height="68" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10" /><rect x="520" y="132" width="632" height="68" rx="14" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".35" class="act" style="animation-delay:-6s"/><circle cx="560" cy="166" r="16" fill="#5eead4" fill-opacity=".18"/><text x="560" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#5eead4">2</text><text x="592" y="173" font-size="19" font-weight="700" fill="#eef2ff">规划</text><text x="652" y="173" font-size="16" fill="#b4bcd6">把目标拆成小步骤，为每一步选好工具</text></g><g class="fade" style="animation-delay:0.50s"><rect x="520" y="212" width="632" height="68" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10" /><rect x="520" y="212" width="632" height="68" rx="14" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".35" class="act" style="animation-delay:-4s"/><circle cx="560" cy="246" r="16" fill="#5eead4" fill-opacity=".18"/><text x="560" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#5eead4">3</text><text x="592" y="253" font-size="19" font-weight="700" fill="#eef2ff">行动</text><text x="652" y="253" font-size="16" fill="#b4bcd6">调用工具，一步一步把事情做完</text></g><g class="fade" style="animation-delay:0.65s"><rect x="520" y="292" width="632" height="68" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".10" /><rect x="520" y="292" width="632" height="68" rx="14" fill="#5eead4" fill-opacity=".12" stroke="#5eead4" stroke-opacity=".35" class="act" style="animation-delay:-2s"/><circle cx="560" cy="326" r="16" fill="#5eead4" fill-opacity=".18"/><text x="560" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#5eead4">4</text><text x="592" y="333" font-size="19" font-weight="700" fill="#eef2ff">反思</text><text x="652" y="333" font-size="16" fill="#b4bcd6">检查结果、记下经验，下一轮做得更好</text></g>
</g>
</g>
<rect x="180" y=".75" width="840" height="1" fill="url(#sheen)"/>
<rect x=".75" y=".75" width="1198.5" height="418.5" rx="23.25" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.5"/>
</svg>